<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Wellness Mood Predictor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
        }

        /* Password */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            padding: 5px;
        }

        .toggle-password:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.3);
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .register-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .alert-error {
            background: #ffe5e5;
            color: #c0392b;
        }

        .alert-success {
            background: #e5f8ed;
            color: #218c5a;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 30px 25px;
            }

        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🧠</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to your AI Wellness Mood Predictor
    </p>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST" action="{{ url_for('login') }}">

        <!-- Email -->

        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <label for="loginPassword">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('loginPassword', this)"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- Forgot Password -->

        <div class="forgot">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

        </div>


        <!-- Login -->

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>


    <div class="register-text">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </div>

</div>


<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}

</script>

</body>
</html>
