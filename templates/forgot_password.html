<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - AI Wellness Mood Predictor</title>


    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;

        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            padding: 20px;

        }


        .forgot-container {

            width: 420px;

            max-width: 100%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.2);

        }


        .logo {

            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            color: #333;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 30px;

        }


        .input-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #444;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px 15px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102,126,234,0.12);

        }


        /* Password */

        .password-wrapper {

            position: relative;

            width: 100%;

        }


        .password-wrapper input {

            padding-right: 50px;

        }


        .toggle-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 19px;

            padding: 5px;

        }


        .toggle-password:hover {

            transform:
                translateY(-50%)
                scale(1.1);

        }


        .change-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .change-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(102,126,234,0.3);

        }


        .back-login {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

        }


        .back-login a {

            color: #667eea;

            text-decoration: none;

            font-weight: bold;

        }


        .back-login a:hover {

            text-decoration: underline;

        }


        .alert {

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

        }


        .alert-error {

            background: #ffe5e5;

            color: #c0392b;

        }


        .alert-success {

            background: #e5f8ed;

            color: #218c5a;

        }


        @media (max-width: 500px) {

            .forgot-container {

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


<div class="forgot-container">


    <div class="logo">
        🔐
    </div>


    <h1>
        Reset Password
    </h1>


    <p class="subtitle">

        Enter your registered email
        and create a new password.

    </p>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >


        <!-- Email -->

        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
                autocomplete="email"
            >

        </div>


        <!-- New Password -->

        <div class="input-group">

            <label for="newPassword">
                New Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="newPassword"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                    autocomplete="new-password"
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('newPassword', this)"
                    aria-label="Show password"
                >

                    👁️

                </button>

            </div>

        </div>


        <button
            type="submit"
            class="change-btn"
        >

            Change Password

        </button>


    </form>


    <div class="back-login">

        <a href="{{ url_for('login') }}">

            ← Back to Login

        </a>

    </div>


</div>


<script>

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    }

    else {

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}

</script>


</body>

</html>
